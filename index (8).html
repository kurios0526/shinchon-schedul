<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신촌교회 All in One</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold-light:#E8C96B;--dark:#0F1114;
  --text:#F8F6F0;--text2:#C8C4BA;--radius:18px;
}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.page{position:relative;min-height:100vh;display:flex;flex-direction:column}
.hero-bg{position:fixed;inset:0;background:url('church.jpg') center/cover no-repeat;filter:brightness(.38) saturate(.75);z-index:0}
.hero-overlay{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(15,17,20,0.15) 0%,rgba(15,17,20,0.55) 50%,rgba(15,17,20,0.92) 100%);z-index:1}
.content{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 30px;max-width:720px;margin:0 auto;width:100%}
.hero-content{text-align:center;margin-bottom:44px}
.hero-cross{font-size:30px;margin-bottom:14px;opacity:.9}
.hero-title{font-family:'Noto Serif KR',serif;font-size:clamp(32px,6vw,58px);font-weight:900;letter-spacing:-1px;line-height:1.15;margin-bottom:10px}
.hero-title span{color:var(--gold)}
.hero-subtitle{font-size:clamp(11px,2vw,14px);color:var(--text2);letter-spacing:4px;font-weight:400;margin-bottom:14px}
.hero-date{font-size:13px;color:var(--gold-light);letter-spacing:1px;opacity:.85}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.nav-btn{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius);padding:26px 28px;cursor:pointer;text-decoration:none;color:var(--text);transition:all .25s;backdrop-filter:blur(16px);position:relative;overflow:hidden}
.nav-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,0.1),transparent);opacity:0;transition:opacity .25s}
.nav-btn:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.5)}
.nav-btn:hover::before{opacity:1}
.nav-btn:active{transform:translateY(0)}
.btn-icon{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.btn-text{text-align:left}
.btn-text strong{display:block;font-size:17px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.btn-text span{font-size:12px;color:var(--text2);letter-spacing:.3px}
.btn-wide{grid-column:1/-1}
.ic-sermon{background:rgba(45,106,10,0.3);border:1px solid rgba(45,106,10,0.5)}
.ic-event{background:rgba(190,24,93,0.3);border:1px solid rgba(190,24,93,0.5)}
.ic-school{background:rgba(21,88,168,0.3);border:1px solid rgba(21,88,168,0.5)}
.ic-youth{background:rgba(124,58,237,0.3);border:1px solid rgba(124,58,237,0.5)}
.ic-room{background:rgba(201,168,76,0.3);border:1px solid rgba(201,168,76,0.5)}
.footer{position:relative;z-index:2;text-align:center;padding:20px;font-size:11px;color:rgba(255,255,255,0.2);letter-spacing:1px}
@media(max-width:500px){
  .btn-grid{grid-template-columns:1fr}
  .hero-content{margin-bottom:32px}
  .nav-btn{padding:20px 18px;gap:14px}
  .btn-icon{width:46px;height:46px;font-size:22px}
  .btn-text strong{font-size:15px}
  .btn-text span{font-size:11px}
}
</style>
</head>
<body>
<div class="page">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="content">
    <div class="hero-content">
      <img src="logo_v2.png" alt="신촌교회 로고" style="width:80px;height:80px;object-fit:contain;margin:0 auto 16px;display:block">
      <h1 class="hero-title">신촌교회<br><span>All in One</span></h1>
      <p class="hero-subtitle">SHINCHON CHURCH</p>
      <p class="hero-date" id="todayDate"></p>
    </div>
    <div class="btn-grid">
      <a href="schedule.html" class="nav-btn">
        <div class="btn-icon ic-sermon">🙏</div>
        <div class="btn-text">
          <strong>설교·사회</strong>
          <span>새벽·수요·주일 섬김</span>
        </div>
      </a>
      <a href="schedule.html?tab=event" class="nav-btn">
        <div class="btn-icon ic-event">🎉</div>
        <div class="btn-text">
          <strong>행사·일정</strong>
          <span>교회 연간 행사</span>
        </div>
      </a>
      <a href="schedule.html?tab=school" class="nav-btn">
        <div class="btn-icon ic-school">🏫</div>
        <div class="btn-text">
          <strong>교회학교</strong>
          <span>교회학교 일정</span>
        </div>
      </a>
      <a href="schedule.html?tab=youth" class="nav-btn">
        <div class="btn-icon ic-youth">✨</div>
        <div class="btn-text">
          <strong>청년부</strong>
          <span>청년부 모임·행사</span>
        </div>
      </a>
      <a href="https://kurios0526.github.io/shichonchurch-booking" target="_blank" class="nav-btn btn-wide">
        <div class="btn-icon ic-room">🏠</div>
        <div class="btn-text">
          <strong>방 예약 시스템</strong>
          <span>공간 예약 및 차량 배정</span>
        </div>
      </a>
    </div>
  </div>
  <div class="footer">© 2026 신촌교회 · SHINCHON CHURCH</div>
</div>
<script>
const d=new Date();
const days=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
document.getElementById('todayDate').textContent=
  d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+days[d.getDay()];
</script>
</body>
</html>
